apiVersion: 1

datasources:
  - name: Energy PostgreSQL
    uid: energy-postgres
    type: postgres
    access: proxy
    isDefault: true
    url: postgres:5432
    user: postgres
    database: Energy
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: postgres
