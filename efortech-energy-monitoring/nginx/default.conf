map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16m;
    proxy_http_version 1.1;

    location = /api/internal/grafana-auth {
        internal;
        proxy_pass http://backend:4000/api/internal/grafana-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
    }

    location @grafana_login_redirect {
        return 302 /;
    }

    location = /grafana/logout {
        return 302 /sign-out;
    }

    location = /grafana/sign-out {
        return 302 /sign-out;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location ~ ^/grafana/api/dashboards/uid/[^/]+/public-dashboards$ {
        auth_request /api/internal/grafana-auth;
        error_page 401 = @grafana_login_redirect;
        default_type application/json;
        return 204;
    }

    location ~ ^/grafana/public/build/build/(.*)$ {
        auth_request /api/internal/grafana-auth;
        auth_request_set $grafana_user $upstream_http_x_webauth_user;
        error_page 401 = @grafana_login_redirect;

        proxy_pass http://grafana:3000/public/build/$1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header X-WEBAUTH-USER $grafana_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /grafana/ {
        auth_request /api/internal/grafana-auth;
        auth_request_set $grafana_user $upstream_http_x_webauth_user;
        error_page 401 = @grafana_login_redirect;

        proxy_pass http://grafana:3000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header X-WEBAUTH-USER $grafana_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://backend:4000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
