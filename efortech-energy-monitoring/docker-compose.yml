services:
  nginx:
    image: nginx:1.27-alpine
    container_name: efortech-nginx
    ports:
      - "4000:80"
    depends_on:
      - backend
      - grafana
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: efortech-backend:latest
    container_name: efortech-backend
    expose:
      - "4000"
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - mosquitto
      - redis
      - influxdb
      - grafana
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/backend/data

  postgres-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: efortech-backend:latest
    container_name: efortech-postgres-worker
    working_dir: /app/backend
    command: ["python", "-m", "workers.analysis_worker"]
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/backend/data

  influx-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: efortech-backend:latest
    container_name: efortech-influx-worker
    working_dir: /app/backend
    command: ["python", "-m", "workers.raw_worker"]
    env_file:
      - .env.docker
    depends_on:
      - redis
      - influxdb
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/backend/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Energy"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    env_file:
      - .env.docker
    command:
      - sh
      - -c
      - >-
        [ -f /mosquitto/data/passwd ] || mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD";
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8-alpine
    container_name: influxdb
    env_file:
      - .env.docker
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_ADMIN_ENABLED: "true"
    restart: unless-stopped
    volumes:
      - influxdb-v1-data:/var/lib/influxdb

  grafana:
    image: efortech-grafana-custom:latest
    container_name: grafana
    env_file:
      - .env.docker
    environment:
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_SYNC_TTL: "15"
      GF_AUTH_PROXY_WHITELIST: 172.18.0.0/16
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
    expose:
      - "3000"
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana


volumes:
  grafana-data:
  postgres-data:
  influxdb-v1-data:
  mosquitto-data:
  mosquitto-log:
